services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: aai3008-pii:latest
    container_name: aai3008_pii_app
    working_dir: /workspace
    env_file:
      - ../.env
    environment:
      HF_HOME: /workspace/.cache/huggingface
      TRANSFORMERS_CACHE: /workspace/.cache/huggingface
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      PYTHONPATH: /workspace
    volumes:
      - ..:/workspace

      # Data directories from host (configured in .env)
      - ${RUNS_DIR_HOST}:/workspace/data/runs
      - ${RAW_DATA_DIR_HOST}:/workspace/data/raw
      - ${GOLD_DATA_DIR_HOST}:/workspace/data/gold

      # Persistent caches from host (configured in .env)
      - ${HF_CACHE_HOST}:/workspace/.cache/huggingface
      - ${PIP_CACHE_HOST}:/root/.cache/pip

    shm_size: "2gb"

    # GPU support (Compose v2)
    gpus: all

    # Optional: keep container alive for iterative dev
    tty: true
    stdin_open: true
