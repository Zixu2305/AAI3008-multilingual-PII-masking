run:
  run_id: "asr_finetuned_large_v3_cs_test"
  output_dir: "data/runs/asr/${run.run_id}"

data:
  source_type: "manifest"
  max_items: 0
  manifest:
    path: "data/raw/cs_dialogue/cs_test/long_wav/manifest.jsonl"

asr:
  engine: "faster_whisper"
  # Local CTranslate2 export of the fine-tuned Whisper large-v3 checkpoint.
  model_name: "data/models/whisper-large-v3/ct2"
  device: "cuda"
  compute_type: "float16"

  language: "auto"
  max_segment_sec: 12.0
  segment_overlap_sec: 0.8
  mixed_language:
    enabled: false
    languages: ["en", "zh"]
    fallback_language: "en"
  word_timestamps: true
  vad_filter: true
  beam_size: 5

export:
  segments_jsonl: "segments.jsonl"
  summary_json: "summary.json"
