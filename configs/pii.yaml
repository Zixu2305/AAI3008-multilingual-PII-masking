run:
  run_id: "pii_baseline_cs_test"
  input_asr_dir: "data/runs/asr/asr_baseline_cs_test"
  output_dir: "data/runs/pii/${run.run_id}"

pii:
  # Hybrid detection = rules + NER + optional LLM
  enable_rules: true
  enable_ner: true
  enable_llm: false

  rules:
    phone: true
    email: true
    zh_phone: true
    en_spoken_phone: true
    id_number: true
    generic_id: true
    address: true
    nric: true
    postal_code: true

  ner:
    # Local v1 fine-tuned weights. Swap to a Hub model ID later if needed.
    model_name: "data/models/ner_finetuned_gold_v1/final/best"
    device: "cuda"
    max_length: 256

    # Map model labels to your project PII tags
    label_map:
      PER: "NAME"
      PERSON: "NAME"
      LOC: "ADDRESS"
      GPE: "ADDRESS"
      ORG: "ORG"

  llm:
    provider: "anthropic"
    model: "claude-sonnet-4-20250514"
    max_tokens: 2048

postprocess:
  # Merge close spans, remove tiny spans, etc.
  merge_gap_chars: 1
  min_span_chars: 2

mask:
  # Used by `python -m src.cli mask`.
  mode: "silence"        # "silence" | "beep"
  # No lead pad: start mask exactly at aligned span start.
  lead_sec: 0.00
  tail_sec: 0.15
  min_interval_sec: 0.20
  merge_gap_sec: 0.05
  beep_freq_hz: 1000
  beep_gain_db: -6.0
  beep_amplitude: 0.20

export:
  spans_jsonl: "spans.jsonl"      # per utterance/segment
  audit_json: "audit.json"        # run metadata
